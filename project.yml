name: Wayfarer
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  MontageCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: '1.0'
targets:
  Wayfarer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: syncedFolder
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateek.wayfarer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wayfarer
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your finished montage to your photo library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Read capture dates for videos you select. Your videos stay on your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MontageCore
schemes:
  Wayfarer:
    build:
      targets:
        Wayfarer: all
    run:
      config: Debug
    archive:
      config: Release
